# Tests on every PR and on master. Builds the Fly/docs image from
# _fly_io/Dockerfile always; pushes immutable tags to GHCR only from
# master and from semver tags (vX.Y.Z). Pull requests never write packages.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Matches _fly_io/Dockerfile (rust:1.95-bookworm). No Rust cache action:
      # the workspace is small enough that a cold build is fine.
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: latest

      - name: Install npm dependencies
        run: npm ci

      # Compiles AssemblyScript modules, then cargo test --workspace.
      - name: Run test suite
        run: task test

  image:
    name: image
    needs: [test]
    runs-on: ubuntu-latest
    # push:false on PRs; packages:write is unused then (standard GHCR pattern).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # master (moving), sha-<short> (immutable), and semver from vX.Y.Z tags.
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: _fly_io/Dockerfile
          # PRs verify the image build only; master/tags publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
