version: '3'

# Every examples/<name>/<name>.oth is an example; its objects are the
# scripts/*.ts next to it, compiled to scripts/*.wasm. Each object's header
# is its scripts/<Type>.oth, and its message types, if it has any, are in
# scripts/<Type>.messages; both are embedded in the .wasm once it is
# compiled. The bindings generated from them are committed next to them, as
# <Type>.messages.ts.
vars:
  # Each example is a directory holding an image named after it.
  EXAMPLES:
    sh: for dir in examples/*/; do name=$(basename "$dir"); [ -f "$dir$name.oth" ] && echo "$name"; done; true
  BIN: target/debug/othismo

tasks:
  build:
    desc: cargo build
    run: once
    cmds:
      - cargo build

  run:
    desc: cargo run, passing on what follows --
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  test:
    desc: Compile every example's objects, then cargo test
    deps: [wasm]
    cmds:
      - cargo test {{.CLI_ARGS}}

  test:e2e:
    desc: Compile every example's objects, then run each examples/*/*.test.oth with othismo test
    deps: [wasm, build]
    vars:
      TEST_IMAGES:
        sh: ls examples/*/*.test.oth
    cmds:
      - for: { var: TEST_IMAGES }
        cmd: '{{.BIN}} test {{.ITEM}}'

  build:docs:
    desc: Re-render docs/*.md, and the reference from as/env/, into the static example's site
    deps: [npm, build]
    sources:
      - docs/*.md
      - as/env/*.oth
      - src/doc.rs
      - examples/static/site.mjs
    cmds:
      - node examples/static/site.mjs

  build:examples:
    desc: cargo build, then seal every example into its .rti
    deps: [build]
    cmds:
      - for: { var: EXAMPLES }
        task: image
        vars: { NAME: '{{.ITEM}}' }

  build:example:*:
    desc: cargo build, then seal one example into its .rti (e.g. build:example:hello)
    vars:
      NAME: '{{index .MATCH 0}}'
    deps: [build]
    cmds:
      - task: image
        vars: { NAME: '{{.NAME}}' }

  run:example:*:
    desc: Build one example's .rti and run it, passing on what follows -- (e.g. run:example:static)
    vars:
      NAME: '{{index .MATCH 0}}'
    cmds:
      - task: build:example:{{.NAME}}
      - '{{.BIN}} examples/{{.NAME}}/{{.NAME}}.rti {{.CLI_ARGS}}'

  deploy:
    desc: cargo build, re-render the docs, and deploy the docs site to fly.io
    cmds:
      - task: build
      - task: build:docs
      - fly deploy

  bindings:
    desc: Regenerate the AssemblyScript bindings from every schema file
    cmds:
      - for: { var: EXAMPLES }
        task: bindings:one
        vars: { NAME: '{{.ITEM}}' }

  clean:
    desc: Remove compiled objects and sealed images
    cmds:
      - rm -f examples/*/scripts/*.wasm examples/*/*.rti

  # Internal tasks.

  npm:
    internal: true
    sources:
      - package.json
      - package-lock.json
      - as/package.json
    status:
      - test -d node_modules
    cmds:
      - npm install

  wasm:
    internal: true
    cmds:
      - for: { var: EXAMPLES }
        task: wasm:one
        vars: { NAME: '{{.ITEM}}' }

  bindings:one:
    internal: true
    label: bindings:{{.NAME}}
    deps: [build]
    cmds:
      - for: { var: HEADERS }
        cmd: '{{.BIN}} bindings {{.ITEM}}'
    vars:
      HEADERS:
        sh: find examples/{{.NAME}}/scripts -name '*.messages'

  wasm:one:
    internal: true
    label: wasm:{{.NAME}}
    deps: [npm, build]
    sources:
      - as/*.ts
      # What embed writes into each module: the header format and env's types.
      - as/env/*.oth
      - src/iface.rs
      - examples/{{.NAME}}/scripts/*.oth
      - examples/{{.NAME}}/scripts/*.messages
      - examples/{{.NAME}}/scripts/*.md
      - examples/{{.NAME}}/scripts/*.ts
      - exclude: examples/{{.NAME}}/scripts/*.messages.ts
    generates:
      - examples/{{.NAME}}/scripts/*.wasm
    cmds:
      - task: bindings:one
        vars: { NAME: '{{.NAME}}' }
      - for: { var: SCRIPTS }
        cmd: npx asc {{.ITEM}} -o {{trimSuffix ".ts" .ITEM}}.wasm --optimize && {{.BIN}} embed {{trimSuffix ".ts" .ITEM}}.oth {{trimSuffix ".ts" .ITEM}}.wasm
    vars:
      SCRIPTS:
        sh: ls examples/{{.NAME}}/scripts/*.ts | grep -v '\.messages\.ts$'

  # Seals examples/<NAME>/<NAME>.oth into a .rti with the othismo that
  # `build` just made, so the two always match.
  image:
    internal: true
    label: image:{{.NAME}}
    preconditions:
      - sh: test -f examples/{{.NAME}}/{{.NAME}}.oth
        msg: 'no example named "{{.NAME}}"; examples are: {{.EXAMPLES | splitLines | join ", "}}'
    cmds:
      - task: wasm:one
        vars: { NAME: '{{.NAME}}' }
      - '{{.BIN}} build examples/{{.NAME}}/{{.NAME}}.oth -o examples/{{.NAME}}/{{.NAME}}.rti'
