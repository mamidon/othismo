version: '3'

# Every examples/<name>/<name>.oth is an example. Objects are modules: the
# reusable ones in sdk/objects/<name>/, and an example's own in its
# scripts/. Each <Type>.ts is compiled to <Type>.wasm beside it. Each
# object's header is its <Type>.oth, and its message types, if it has any,
# are in <Type>.messages; both are embedded in the .wasm once it is
# compiled. The bindings generated from them are committed next to them, as
# <Type>.oth.ts and <Type>.messages.ts.
vars:
  # Each example is a directory holding an image named after it.
  EXAMPLES:
    sh: for dir in examples/*/; do name=$(basename "$dir"); [ -f "$dir$name.oth" ] && echo "$name"; done; true
  # Each directory of modules: the SDK's objects, then each example's own.
  MODULE_DIRS:
    sh: for dir in sdk/objects/*/ examples/*/scripts/; do [ -d "$dir" ] && echo "${dir%/}"; done; true
  BIN: target/debug/othismo

tasks:
  build:
    desc: cargo build
    run: once
    cmds:
      - cargo build

  run:
    desc: cargo run, passing on what follows --
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  test:
    desc: Compile every example's objects, then test every crate
    deps: [wasm]
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  test:e2e:
    desc: Compile every example's objects, then run each examples/*/*.test.oth with othismo test
    deps: [wasm, build]
    vars:
      TEST_IMAGES:
        sh: ls examples/*/*.test.oth
    cmds:
      - for: { var: TEST_IMAGES }
        cmd: '{{.BIN}} test {{.ITEM}}'

  build:docs:
    desc: Re-render docs/*.md, and the reference from sdk/env/, into the static example's site
    deps: [npm, build]
    sources:
      - docs/*.md
      - sdk/env/*.oth
      - crates/**/*.rs
      - examples/static/site.mjs
    cmds:
      - node examples/static/site.mjs

  build:examples:
    desc: cargo build, then seal every example into its .rti
    deps: [build]
    cmds:
      - for: { var: EXAMPLES }
        task: image
        vars: { NAME: '{{.ITEM}}' }

  build:example:*:
    desc: cargo build, then seal one example into its .rti (e.g. build:example:hello)
    vars:
      NAME: '{{index .MATCH 0}}'
    deps: [build]
    cmds:
      - task: image
        vars: { NAME: '{{.NAME}}' }

  run:example:*:
    desc: Build one example's .rti and run it, passing on what follows -- (e.g. run:example:static)
    vars:
      NAME: '{{index .MATCH 0}}'
    cmds:
      - task: build:example:{{.NAME}}
      - '{{.BIN}} examples/{{.NAME}}/{{.NAME}}.rti {{.CLI_ARGS}}'

  deploy:
    desc: cargo build, re-render the docs, and deploy the docs site to fly.io
    cmds:
      - task: build
      - task: build:docs
      - fly deploy

  bindings:
    desc: Regenerate the AssemblyScript bindings from every header and schema file
    cmds:
      - task: bindings:env
      - for: { var: MODULE_DIRS }
        task: bindings:one
        vars: { DIR: '{{.ITEM}}' }

  clean:
    desc: Remove compiled objects and sealed images
    cmds:
      - rm -f sdk/objects/*/*.wasm examples/*/scripts/*.wasm examples/*/*.rti

  # Internal tasks.

  npm:
    internal: true
    sources:
      - package.json
      - package-lock.json
      - sdk/assemblyscript/package.json
    status:
      - test -d node_modules
    cmds:
      - npm install

  wasm:
    internal: true
    cmds:
      - for: { var: MODULE_DIRS }
        task: wasm:one
        vars: { DIR: '{{.ITEM}}' }

  # The runtime's clients and server bases, which modules import as "othismo/env".
  bindings:env:
    internal: true
    deps: [build]
    sources:
      - sdk/env/*.oth
      - crates/**/*.rs
    generates:
      - sdk/assemblyscript/env.ts
    cmds:
      - '{{.BIN}} bindings --library ./index env -o sdk/assemblyscript/env.ts'

  bindings:one:
    internal: true
    label: bindings:{{.DIR}}
    deps: [build]
    cmds:
      - for: { var: HEADERS }
        cmd: '{{.BIN}} bindings {{.ITEM}}'
    vars:
      HEADERS:
        sh: find {{.DIR}} -maxdepth 1 -name '*.messages' -o -maxdepth 1 -name '*.oth'

  wasm:one:
    internal: true
    label: wasm:{{.DIR}}
    deps: [npm, bindings:env]
    sources:
      - sdk/assemblyscript/*.ts
      # What embed writes into each module: the header format and env's types.
      - sdk/env/*.oth
      - crates/**/*.rs
      - '{{.DIR}}/*.oth'
      - '{{.DIR}}/*.messages'
      - '{{.DIR}}/*.md'
      - '{{.DIR}}/*.ts'
      - exclude: '{{.DIR}}/*.messages.ts'
      - exclude: '{{.DIR}}/*.oth.ts'
    generates:
      - '{{.DIR}}/*.wasm'
    cmds:
      - task: bindings:one
        vars: { DIR: '{{.DIR}}' }
      - for: { var: SCRIPTS }
        cmd: npx asc {{.ITEM}} -o {{trimSuffix ".ts" .ITEM}}.wasm --optimize && {{.BIN}} embed {{trimSuffix ".ts" .ITEM}}.oth {{trimSuffix ".ts" .ITEM}}.wasm
    vars:
      SCRIPTS:
        sh: ls {{.DIR}}/*.ts | grep -v -e '\.messages\.ts$' -e '\.oth\.ts$'

  # Seals examples/<NAME>/<NAME>.oth into a .rti with the othismo that
  # `build` just made, so the two always match.
  image:
    internal: true
    label: image:{{.NAME}}
    preconditions:
      - sh: test -f examples/{{.NAME}}/{{.NAME}}.oth
        msg: 'no example named "{{.NAME}}"; examples are: {{.EXAMPLES | splitLines | join ", "}}'
    cmds:
      # An example may use any of the SDK's objects, so every module is compiled.
      - task: wasm
      - '{{.BIN}} build examples/{{.NAME}}/{{.NAME}}.oth -o examples/{{.NAME}}/{{.NAME}}.rti'
