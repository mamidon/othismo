# Deploys the docs site defined in _fly_io/. Run flyctl from this directory,
# which is also the Docker build context: `fly launch --no-deploy` once to
# name the app, then `fly deploy`.

[build]
  dockerfile = "_fly_io/Dockerfile"

[http_service]
  internal_port = 8080          # where docs.img listens
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  memory = "256mb"
