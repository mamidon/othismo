# The othismo workspace. Its crates are in crates/, and the AssemblyScript
# SDK, the runtime's header and reusable objects are in sdk/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
syntax = { path = "crates/syntax" }
format = { path = "crates/format" }
format-bson = { path = "crates/format-bson" }
anyhow = "1.0.104"
bson = { version = "3.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
wasmtime = { version = "48.0.7", features = ["anyhow"] }
wat = "1.262.0"

[package]
name = "othismo"
version.workspace = true
edition.workspace = true

[dependencies]
protocol.workspace = true
syntax.workspace = true
format.workspace = true
format-bson.workspace = true
anyhow.workspace = true
bson.workspace = true
serde.workspace = true
sha2.workspace = true
wasmtime.workspace = true

[dev-dependencies]
wat.workspace = true
