# Deploys the image built by Dockerfile. Give the app a name with
# `fly launch --no-deploy -c _fly_io/fly.toml`, or pass `-a <name>` to fly deploy.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080          # where docs.img listens
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  memory = "256mb"
