[package]
name = "cli"
description = "The othismo command: run, shell, test, build, unpack, embed, bindings and doc"
version.workspace = true
edition.workspace = true

# The library re-exports the crates under the names the command and the
# tests use.
[lib]
name = "othismo"

[[bin]]
name = "othismo"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
syntax.workspace = true
format.workspace = true
format-bson.workspace = true
image.workspace = true
runtime.workspace = true
compiler.workspace = true
codegen.workspace = true
shell.workspace = true
anyhow.workspace = true

[dev-dependencies]
bson.workspace = true
wat.workspace = true
